<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Strukti Solutions — software sob medida e sistemas embarcados">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#E8F2FF" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1F5FBF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1F5FBF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0B1E3F"/>
      <stop offset="100%" stop-color="#1F5FBF"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="#FFFFFF"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#fade)"/>

  <!-- circuit traces -->
  <g fill="none" stroke="#B5D3F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1280 64H1120L1088 96V160H1000"/>
    <path d="M1280 256H1152L1120 224V176H1000"/>
    <path d="M1000 128H936L904 160H860"/>
    <path d="M1000 208H936L904 176"/>
    <path d="M1216 0V32L1184 64"/>
    <path d="M1024 320V272L1056 240H1120"/>
  </g>
  <g fill="#FFFFFF" stroke="#B5D3F5" stroke-width="2">
    <circle cx="1000" cy="160" r="5"/><circle cx="1000" cy="176" r="5"/>
    <circle cx="1000" cy="128" r="5"/><circle cx="1000" cy="208" r="5"/>
    <circle cx="1184" cy="64" r="5"/><circle cx="1120" cy="240" r="5"/>
  </g>
  <!-- chip -->
  <g>
    <rect x="1010" y="112" width="88" height="112" rx="6" fill="#FFFFFF" stroke="#B5D3F5" stroke-width="2"/>
    <g stroke="#B5D3F5" stroke-width="2">
      <path d="M1030 112V100M1046 112V100M1062 112V100M1078 112V100"/>
      <path d="M1030 224V236M1046 224V236M1062 224V236M1078 224V236"/>
    </g>
    <text x="1054" y="174" text-anchor="middle" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="15" letter-spacing="2" fill="#3B6FB5">STK-01</text>
  </g>
  <!-- status LED -->
  <circle cx="860" cy="160" r="34" fill="url(#glow)">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="860" cy="160" r="7" fill="#1F5FBF"/>

  <!-- wordmark -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <rect x="72" y="86" width="10" height="94" fill="url(#bar)"/>
    <text x="104" y="166" font-size="84" font-weight="700" letter-spacing="10" fill="#0B1E3F">STRUKTI</text>
    <text x="108" y="202" font-size="20" font-weight="600" letter-spacing="14" fill="#3B6FB5">SOLUTIONS</text>
  </g>
  <text x="74" y="252" font-family="Consolas, 'JetBrains Mono', Menlo, monospace" font-size="18" fill="#3B6FB5">
    <tspan fill="#1F5FBF">&gt;</tspan> software sob medida · sistemas embarcados
  </text>
</svg>
